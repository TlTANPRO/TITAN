# TITAN Daily Update Workflow
#
# Runs every day at 23:00 WIB (16:00 UTC) to:
#   1. Scrape Instagram accounts (incremental, 1-day window)
#   2. Scrape TikTok accounts (incremental, 1-day window)
#   3. Validate merged data (pre-flight check: 9 akun, ≥4000 posts, no cross-dup)
#   4. Generate src/data/accounts-full.json + public/data/accounts-full.json
#   5. Generate AI insights (optional, falls back to analytics-only if Worker fails)
#   6. Build Vite production bundle
#   7. Deploy to GitHub Pages (atomic: copy dist→root, commit, push)
#
# Sunday 23:00 WIB → full re-scrape (catch-up for any missed days).
# Other days → incremental 1-day window (fast + cheap).
#
# Can also be triggered manually via workflow_dispatch with custom inputs.
name: TITAN Daily Update

on:
  schedule:
    # 16:00 UTC = 23:00 WIB (Asia/Jakarta)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to scrape'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - ig
          - tt
      force_full_scrape:
        description: 'Force full scrape (instead of incremental 1-day window)'
        required: false
        type: boolean
        default: false
      regenerate_ai:
        description: 'Force regenerate AI insights'
        required: false
        type: boolean
        default: false

concurrency:
  group: titan-daily-update
  cancel-in-progress: false

jobs:
  update:
    name: Scrape + Generate + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write   # git push for deploy
    env:
      # Fail loud on validation errors, fail soft on scrape errors
      FAIL_LATEST: true
      # V34.13: All scrapers are FREE methods (i.instagram.com /clips/user/,
      # TikWM via Jina, Jina web profile for TT). No API key required.
      ENSEMBLEDATA_TOKENS: ${{ secrets.TITAN_ENSEMBLEDATA_TOKEN }}
      # V27.16: kill switch. Now that V28 uses free methods, this is a
      # no-op (the wrapper just logs and continues). Kept for safety.
      ENSEMBLEDATA_TOKENS_SKIP: "true"
      # V36: authenticated self-scrape via the account OWNER's own session
      # cookies (free, no paid API). Set as repo secrets (Actions → Secrets):
      #   IG_SESSION_COOKIE — IG: "sessionid=...; csrftoken=...; mid=..." (from
      #     the owner's logged-in instagram.com browser, DevTools → Cookies)
      #   TT_SESSION_COOKIE — TT: "ttwid=...; msToken=...; tt_csrf_token=...; sessionid=..."
      #     (from the owner's logged-in tiktok.com browser)
      IG_SESSION_COOKIE: ${{ secrets.IG_SESSION_COOKIE }}
      TT_SESSION_COOKIE: ${{ secrets.TT_SESSION_COOKIE }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        # V27.11: Node 22 LTS. NO `cache:` — the only options are
        # 'npm' (needs package-lock.json), 'pnpm' (needs pnpm-lock.yaml
        # BUT pnpm isn't installed yet at this step), 'yarn' (needs
        # yarn.lock). We use pnpm, so we skip the setup-node cache and
        # let pnpm's own store cache + runner warm cache handle speed.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm 9 (match lockfile v9)
        # V27.10: install via npm globally instead of corepack — the corepack
        # shim lives at a path that subsequent steps don't always inherit
        # on the GH runner, causing "Unable to locate executable file: pnpm"
        # even after `corepack prepare pnpm@9 --activate` succeeded.
        # npm-global install lands in /usr/local/bin which is on the default
        # PATH for every subsequent step.
        run: npm install -g pnpm@9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # V27.12: Cold-start bootstrap. scripts/scraped/ is gitignored but the
      # commit step at the end tries to commit it. If a previous CI run
      # failed before commit, the runner starts with an empty scraped/ dir
      # → scrape-incremental has nothing to read → generate-data finds 0
      # files → post-write guard fails. Hydrate from the bundled
      # src/data/accounts-full.json (which IS committed) before scraping.
      - name: Bootstrap scraped/ from bundled data
        if: success()
        run: node scripts/bootstrap-scraped-from-bundled.mjs

      # V26: smart cadence — Sunday = full re-scrape (weekly catch-up).
      # Other days = incremental 1-day window. Manual override via
      # workflow_dispatch input `force_full_scrape=true`.
      # V34.13: export IS_SUNDAY=true env var so downstream steps
      # (health gate, worker-status writer) can branch on weekday vs Sunday.
      # Moved BEFORE the scrape steps (V37) so the TT browser scraper can
      # branch full-vs-incremental on the cadence output.
      - name: Detect weekly catch-up day (Sunday UTC) + export IS_SUNDAY
        id: cadence
        run: |
          day=$(date -u +%u)
          if [ "$day" = "7" ]; then
            echo "weekly_full=true" >> $GITHUB_OUTPUT
            echo "IS_SUNDAY=true" >> $GITHUB_ENV
            echo "::notice::Sunday detected → weekly full re-scrape, health gate relaxed"
          else
            echo "weekly_full=false" >> $GITHUB_OUTPUT
            echo "IS_SUNDAY=false" >> $GITHUB_ENV
            echo "::notice::Weekday ($day) → incremental 1-day scrape"
          fi

      # ============== AUTHENTICATED SCRAPE (V36/V37 — PRIMARY, owner cookie) ==============
      # All free post-listing endpoints die since ~2026-08-25 (verified 2026-08-29:
      # IG 401/400, TT yt-dlp "Unable to extract secondary user ID", Jina 403,
      # RSS login wall). The owner's own session cookie is now the primary source.
      # Fails soft (exit 2, no cookie/invalid) so deploy never blocks — the free
      # fallback steps below then run with existing data.
      - name: Scrape Instagram (authenticated cookie V36)
        id: scrape-ig-cookie
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ig' || github.event.inputs.platform == '' }}
        run: |
          echo "Authenticated IG scrape (owner session cookie)"
          echo "pages=6 (72 newest posts/account) + gap=12s — deliberately low volume"
          echo "to stay far under IG throttle (bursts of 150+ pages trip a fake"
          echo "login_required checkpoint on the session)"
          node scripts/scrape-ig-cookie.mjs pages=6 gap=12
        continue-on-error: true

      # V37: raw `fetch` with the TT cookie is DEAD — TikTok serves a captcha
      # shell + demands a per-request a_bogus signature the cookie can't supply.
      # The headless-browser route works (verified local 2026-08-30): launch
      # Chrome, inject the owner cookies, load the profile — TikTok's own JS
      # signs the /api/post/item_list/ calls — then capture the JSON responses
      # via CDP Network.getResponseBody while auto-scrolling. Full crawl on
      # Sunday (weekly catch-up), incremental pages=5 (~80 newest) on weekdays
      # to keep request count low on the owner session.
      - name: Scrape TikTok (authenticated browser V37)
        id: scrape-tt-cookie
        if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'tt' || github.event.inputs.platform == '' }}
        run: |
          if [ "${{ github.event.inputs.force_full_scrape }}" = "true" ] || [ "${{ steps.cadence.outputs.weekly_full }}" = "true" ]; then
            echo "Full TT browser scrape (V37, all posts via headless Chrome)"
            node scripts/scrape-tt-browser.mjs
          else
            echo "Incremental TT browser scrape (V37, pages=5 ≈ newest 80)"
            node scripts/scrape-tt-browser.mjs pages=5
          fi
        continue-on-error: true

      # ============== SCRAPE PHASE (free FALLBACK — only if cookie step didn't succeed) ==============

      - name: Scrape Instagram (free fallback)
        if: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ig' || github.event.inputs.platform == '') && steps.scrape-ig-cookie.outcome != 'success' }}
        run: |
          if [ "${{ github.event.inputs.force_full_scrape }}" = "true" ] || [ "${{ steps.cadence.outputs.weekly_full }}" = "true" ]; then
            echo "Full IG scrape (free fallback, V28: i.instagram.com /clips/user/ + /feed/user/)"
            node scripts/scrape-ig.mjs --force
          else
            echo "Incremental IG scrape (free fallback, V28)"
            node scripts/scrape-ig.mjs
          fi
        continue-on-error: true
        id: scrape-ig

      - name: Log IG scrape result
        if: always() && steps.scrape-ig.outcome != 'skipped'
        run: |
          echo "::notice::IG scrape outcome=${{ steps.scrape-ig.outcome }}"

      - name: Scrape TikTok (free fallback)
        if: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'tt' || github.event.inputs.platform == '') && steps.scrape-tt-cookie.outcome != 'success' }}
        run: |
          if [ "${{ github.event.inputs.force_full_scrape }}" = "true" ] || [ "${{ steps.cadence.outputs.weekly_full }}" = "true" ]; then
            echo "Full TT scrape (free fallback: Jina web profile + TikWM search via Jina)"
            node scripts/scrape-tt.mjs --force
          else
            echo "Incremental TT scrape (free fallback)"
            node scripts/scrape-tt.mjs
          fi
        continue-on-error: true
        id: scrape-tt

      - name: Log TT scrape result
        if: always() && steps.scrape-tt.outcome != 'skipped'
        run: |
          echo "::notice::TT scrape outcome=${{ steps.scrape-tt.outcome }}"

      # ============== V34: URLEBIRD TT SCRAPER (primary) ==============
      # Old DDG/Bing discovery went stale up to 2 months (verified 2026-08-23).
      # Urlebird via Jina returns the 20 latest videos per account with exact
      # snowflake timestamps + full stats. Append-only merge, id-deduped.
      # V35: yt-dlp is PRIMARY (verified 2026-08-24: all 5 accounts, exact
      # snowflake timestamps). Urlebird kept as fallback (started returning
      # 403/0-videos on 2026-08-23 run).
      - name: Scrape TikTok via yt-dlp (V35 primary, free fallback)
        if: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'tt' || github.event.inputs.platform == '') && steps.scrape-tt-cookie.outcome != 'success' }}
        run: |
          echo "yt-dlp TT scrape (V35 primary, free fallback)"
          pip install -q yt-dlp || true
          node scripts/scrape-tt-ytdlp.mjs
          echo "::notice::TT yt-dlp scrape outcome=success"
          node scripts/enrich-tt-tikwm-v36.mjs --limit=40 || echo "::warning::TT enrich failed — counts stay empty"
        id: scrape-tt-ytdlp

      - name: Scrape TikTok via Urlebird (fallback)
        if: ${{ (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'tt' || github.event.inputs.platform == '') && steps.scrape-tt-cookie.outcome != 'success' }}
        run: |
          echo "Urlebird TT scrape (V34 fallback: profile listing + detail stats)"
          node scripts/scrape-tt-urlebird.mjs || echo "::warning::Urlebird TT scrape failed — old data kept"
        continue-on-error: true
        id: scrape-tt-urlebird

      - name: Log Urlebird TT scrape result
        if: always() && steps.scrape-tt-urlebird.outcome != 'skipped'
        run: |
          echo "::notice::TT Urlebird scrape outcome=${{ steps.scrape-tt-urlebird.outcome }}"

      # ============== ADMIN COMMENTS PHASE (fail soft) ==============
      # V34.9 → V38: scrape comments left by our admins (Reni/Rifqi/Reta/Julian)
      # on their own posts and on other people's posts.
      #   - TT: V38 headless-Chrome/CDP (scrape-comments-tt-browser.mjs) — opens
      #     each video, opens the comment tray, captures the page's own signed
      #     /api/comment/list/ XHRs. No more TikWM (dead). Scans own posts of all
      #     5 TT accounts since 2026-08-01 + external targets in
      #     scripts/comment-scan-extras.json. limit= tuned per day below.
      #   - IG: Jina proxy is dead (403 since ~25 Aug) and the IG scraped file is
      #     stale (no posts since Aug 1) — step kept as a no-op guard; manual
      #     dataset entries are preserved by the aggregator regardless.
      # Aggregate merges raw scraped + existing manual dataset via dedup by id.
      # Fails soft per step so a single API hiccup doesn't block deploy.

      - name: Scrape comments IG (Jina proxy — dead, no-op)
        if: success()
        run: |
          echo "Scrape IG comments via Jina (majangmejeng_ only)"
          node scripts/scrape-comments-ig.mjs || echo "::warning::IG comments scrape failed — continuing with manual dataset only"
        continue-on-error: true
        id: scrape-comments-ig

      - name: Scrape comments TT (V38 headless Chrome)
        if: success()
        run: |
          echo "Scrape TT comments via headless Chrome (V38)"
          if [ "${{ steps.cadence.outputs.weekly_full }}" = "true" ]; then
            node scripts/scrape-comments-tt-browser.mjs limit=250
          else
            node scripts/scrape-comments-tt-browser.mjs limit=30
          fi
        continue-on-error: true
        id: scrape-comments-tt

      - name: Aggregate admin comments
        if: success()
        run: |
          echo "Merge scraped + manual comments → src/data/admin-comments.json"
          node scripts/aggregate-admin-comments.mjs

      - name: Enrich IG posts via Embed scraper
        if: success()
        run: |
          echo "Enrich IG post metrics via facebookexternalhit embed scraper"
          node scripts/enrich-ig-embed.mjs || echo "::warning::IG embed enrichment failed — existing metrics kept"
        continue-on-error: true

      # ============== SCRAPE HEALTH GATE (V34.12) ==============
      # Hard-fail if scrapers produced zero fresh posts today. Without this,
      # `continue-on-error: true` on scrape-ig/scrape-tt swallows V32.4 exit 2
      # (silent zero-new scrape) and the workflow still "succeeds" — deploy
      # then ships stale accounts-full.json → calendar visibly stuck.
      # This step is a NO-OP on Sunday full-scrape (still expected to find
      # posts); on weekday incremental it catches the regression directly.

      - name: Scrape health gate (V34.12)
        run: |
          echo "==================================="
          echo "Scrape health gate (V34.12)"
          echo "Verifying at least one account has fresh posts dated today"
          echo "==================================="
          node scripts/scrape-health-check.mjs
          if [ $? -ne 0 ]; then
            echo "::error::Scrape health gate FAILED — scrapers produced zero fresh posts. Aborting deploy to avoid stale dashboard."
            exit 1
          fi
          echo "::notice::Scrape health gate passed"

      # ============== VALIDATION PHASE (fail loud) ==============

      - name: Validate merged data (pre-flight)
        run: |
          echo "==================================="
          echo "Pre-flight validation"
          echo "==================================="
          node scripts/validate-merge.mjs
          if [ $? -ne 0 ]; then
            echo "::error::Pre-flight validation FAILED — aborting deploy"
            exit 1
          fi
          echo "::notice::Pre-flight validation passed"

      # ============== GENERATE PHASE (fail loud) ==============

      - name: Generate accounts-full.json
        run: node scripts/generate-data.mjs

      # V30.2: re-scrape 9 profile avatars via facebookexternalhit/1.1 UA
      # (moved from deleted incremental.yml). Avatars valid 1-2 days;
      # daily refresh keeps dashboard showing real profile photos
      # instead of brand-icon tiles. continue-on-error so a single
      # rate-limit doesn't halt data refresh.
      - name: Scrape fresh avatars
        if: success()
        run: node scripts/scrape-avatars.mjs
        continue-on-error: true

      # V34: REAL IG avatars via embed-page chain (og:image chain grabs the
      # generic IG logo placeholder — verified bug). Validated: JPEG/PNG only,
      # unique hash per account, owner-pic matched by known media-id.
      - name: Scrape real IG avatars (V34)
        if: success()
        run: node scripts/scrape-avatars-ig.mjs || echo "::warning::IG avatar scrape failed — old avatars kept"
        continue-on-error: true

      - name: Generate AI insights (optional, fail soft)
        env:
          VITE_LLM_PROXY_URL: ${{ secrets.LLM_PROXY_URL }}
          VITE_TITAN_KEY: ${{ secrets.TITAN_CLIENT_KEY }}
          TITAN_CLIENT_KEY: ${{ secrets.TITAN_CLIENT_KEY }}
        run: |
          if [ "${{ github.event.inputs.regenerate_ai }}" = "true" ]; then
            echo "Force regenerate AI insights"
            pnpm insights:generate
          else
            echo "Generate AI insights (continue on error)"
            pnpm insights:generate || echo "::warning::AI insights generation failed — continuing with analytics-only mode"
          fi

      # ============== BUILD PHASE ==============

      # V28.1: VITE_LLM_PROXY_URL is PUBLIC (the Worker URL is bundled into
      # the client, not a secret). Bake it into the build so the live site
      # chat panel auto-connects to the Worker instead of falling back to
      # direct mode (which requires API keys in localStorage). Without
      # this, every GitHub Actions deploy produces a bundle that asks the
      # user to enter a Google/OpenRouter API key.
      - name: Build production bundle
        env:
          VITE_LLM_PROXY_URL: https://titan-llm-proxy.nickasad10007.workers.dev
        run: pnpm run build

      # ============== DEPLOY PHASE ==============

      - name: Configure git for deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GH_TOKEN="$GH_TOKEN" pnpm run deploy
          if [ $? -ne 0 ]; then
            echo "::error::Deploy failed"
            exit 1
          fi
          echo "::notice::Deploy complete — https://tltanpro.github.io/TITAN/"

      # ============== NOTIFY (always run, even on partial failure) ==============

      - name: Summary
        if: always()
        run: |
          echo "==================================="
          echo "TITAN Daily Update Summary"
          echo "==================================="
          echo "Date: $(date -u)"
          echo "Cadence: ${{ steps.cadence.outputs.weekly_full == 'true' && 'weekly full re-scrape' || 'incremental 1-day' }}"
          echo "IG scrape: ${{ steps.scrape-ig.outcome }}"
          echo "TT scrape: ${{ steps.scrape-tt.outcome }}"
          echo "Build outcome: ${{ steps.build.outcome }}"
          echo "Last success: $(cat scripts/.last-success 2>/dev/null || echo 'NEVER')"
          echo "Last fresh count: $(node -e "const s = require('./scripts/worker-status.json'); console.log(s.lastFreshCount ?? 'n/a')" 2>/dev/null || echo 'n/a')"
          echo "Last error: $(node -e "const s = require('./scripts/worker-status.json'); console.log(s.lastError ?? 'none')" 2>/dev/null || echo 'n/a')"
          echo "==================================="
